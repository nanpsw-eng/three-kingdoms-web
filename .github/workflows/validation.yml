name: validation

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'implementation/bootstrap'

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type, content, unit, golden and build checks
        run: npm run check

      - name: Chromium responsive E2E
        run: npm run test:e2e
